<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robotrac HR | Audit Log</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
<script src="js/config.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/admin-common.js" defer></script>
<script src="js/audit-log.js" defer></script>
</head>
<body class="admin">
<a class="visually-hidden" href="#main">Skip to content</a>
<header class="admin-top">
  <div class="inner">
    <a class="admin-brand" href="admin-dashboard.html"><img class="brand-mark" src="assets/robotrac-mark.jpg" alt="Robotrac"><span>HR Console</span></a>
    <nav class="admin-nav" aria-label="HR navigation">
      <a href="admin-dashboard.html">Dashboard</a>
      <a href="drive-management.html">Drives</a>
      <a href="candidate-management.html">Candidates</a>
      <a href="question-bank.html">Question Bank</a>
      <a href="results-dashboard.html">Results</a>
      <a href="audit-log.html">Audit Log</a>
      <a href="admin-users.html">HR Users</a>
    </nav>
    <div class="admin-user"><span id="adminName"></span><button type="button" class="btn btn-secondary btn-sm" id="adminLogout">Log out</button></div>
  </div>
</header>
<main class="admin-main" id="main">
  <div class="page-head">
    <div><h1>Audit log</h1><p>Sensitive actions: logins, drive changes, authorisations, imports, exports and submissions. Passwords and answer keys are never logged.</p></div>
  </div>
  <div class="notice hidden" id="notice" role="alert"></div>
  <section class="card card-pad">
    <div class="toolbar">
      <div class="form-field"><label for="actionSel">Action</label><select class="input" id="actionSel">
        <option value="">All actions</option>
        <option>ADMIN_LOGIN</option><option>ADMIN_LOGIN_FAILED</option><option>ADMIN_SETUP_COMPLETED</option><option>ADMIN_USER_CREATED</option><option>ADMIN_PASSWORD_CHANGED</option>
        <option>CANDIDATE_LOGIN</option><option>CANDIDATE_LOGIN_FAILED</option><option>CANDIDATE_LOGIN_REFUSED</option>
        <option>DRIVE_CREATED</option><option>DRIVE_UPDATED</option><option>DRIVE_PASSWORD_CHANGED</option><option>DRIVE_ACTIVATED</option><option>DRIVE_DEACTIVATED</option><option>DRIVE_CLOSED</option>
        <option>CANDIDATE_AUTHORIZED</option><option>CANDIDATE_REAUTHORIZED</option><option>CANDIDATES_BULK_AUTHORIZED</option><option>CANDIDATE_REVOKED</option>
        <option>QUESTIONS_IMPORTED</option><option>QUESTION_EDITED</option><option>QUESTION_REVIEW_STATUS</option><option>QUESTION_ACTIVATED</option><option>QUESTION_DEACTIVATED</option>
        <option>ATTEMPT_STARTED</option><option>ATTEMPT_FINALIZED</option><option>ATTEMPT_REVIEWED</option><option>RESULTS_EXPORTED</option><option>PAPER_GENERATION_FAILED</option>
      </select></div>
      <div class="form-field grow"><label for="search">Search</label><input class="input" id="search" type="search" placeholder="Actor, entity or details"></div>
    </div>
    <div class="table-wrap">
      <table class="data">
        <thead><tr><th scope="col">Time</th><th scope="col">Actor</th><th scope="col">Action</th><th scope="col">Entity</th><th scope="col">Details</th><th scope="col">IP</th></tr></thead>
        <tbody id="rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </section>
</main>
</body>
</html>
