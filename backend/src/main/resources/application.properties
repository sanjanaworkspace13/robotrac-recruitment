# =====================================================================
# Robotrac Recruitment Portal - main configuration
# Secrets are NEVER written here. They come from environment variables
# (see ../.env.example and README "Configure local credentials").
# =====================================================================
spring.application.name=robotrac-recruitment

# ---------- Server ----------
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=90m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set SESSION_COOKIE_SECURE=true when the site is served over HTTPS (production).
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.name=ROBOTRAC_SESSION
server.error.include-stacktrace=never
server.error.include-message=never

# ---------- Database (MySQL 8) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/robotrac_recruitment?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:robotrac_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000

# Flyway owns the schema; Hibernate never creates or alters tables.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------- Multipart uploads (question workbook, candidate CSV) ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- Frontend ----------
# The backend also serves the ../frontend folder so everything runs on one origin
# (http://localhost:8080). Change APP_FRONTEND_DIR if you start the backend from another folder.
app.frontend-dir=${APP_FRONTEND_DIR:file:../frontend/}
spring.web.resources.static-locations=${app.frontend-dir},classpath:/static/

# Extra origins allowed to call the API with cookies (e.g. VS Code Live Server).
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5500}

# ---------- Question bank ----------
# On first start (empty question table) the workbook below is imported automatically.
app.question-bank.seed-on-startup=${APP_SEED_QUESTIONS:true}
app.question-bank.seed-file=${APP_SEED_FILE:../database/question-bank/Robotrac_Company_Level_Aptitude_Bank_150_40min.xlsx}

# ---------- Examination ----------
# Seconds after the deadline during which an in-flight answer save is still accepted.
app.exam.save-grace-seconds=2
# How often the server finalises attempts whose deadline has passed (milliseconds).
app.exam.expiry-sweep-ms=15000

# ---------- Rate limits ----------
app.rate-limit.login-max-attempts=10
app.rate-limit.login-max-failures-per-ip=100
app.rate-limit.login-window-minutes=15
app.rate-limit.monitoring-events-per-minute=40
app.rate-limit.responses-per-minute=180

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
