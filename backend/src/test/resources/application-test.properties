# Test profile: isolated in-memory H2 database in MySQL compatibility mode.
# Your real MySQL database is never touched by "mvnw test".
spring.datasource.url=jdbc:h2:mem:robotrac_test_${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.question-bank.seed-on-startup=false
app.frontend-dir=classpath:/static/
app.exam.expiry-sweep-ms=3600000
app.rate-limit.login-max-attempts=1000
app.rate-limit.monitoring-events-per-minute=1000
app.rate-limit.responses-per-minute=10000
logging.level.root=WARN
