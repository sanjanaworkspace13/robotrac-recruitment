<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robotrac | First-time Setup</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">
<script src="js/config.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/admin-setup.js" defer></script>
</head>
<body class="auth-page">
<main class="shell">
  <div class="brand"><img alt="Robotrac — Electric | Robotic | Autonomous" src="assets/robotrac-logo.jpg"></div>
  <section class="card auth-card" aria-labelledby="page-title">
    <h1 id="page-title">First-time setup</h1>
    <p class="subtitle">Create the first HR / administrator account</p>
    <div class="accent"></div>
    <div class="notice hidden" id="statusNotice" role="status"></div>
    <form id="setupForm" class="hidden" novalidate>
      <div class="field">
        <label for="token">One-time setup token</label>
        <div class="input-wrap"><span class="icon" aria-hidden="true">⚿</span><input id="token" type="text" autocomplete="off" spellcheck="false" placeholder="Paste the token from the server console" required></div>
      </div>
      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap"><span class="icon" aria-hidden="true">☺</span><input id="username" type="text" autocomplete="username" maxlength="60" placeholder="e.g. hr.admin" required></div>
      </div>
      <div class="field">
        <label for="fullName">Full name</label>
        <div class="input-wrap"><span class="icon" aria-hidden="true">✎</span><input id="fullName" type="text" autocomplete="name" maxlength="120" placeholder="Your name" required></div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap"><span class="icon" aria-hidden="true">▣</span><input id="password" type="password" autocomplete="new-password" maxlength="128" placeholder="At least 12 characters" required aria-describedby="pwHint"></div>
        <div class="field-error muted" id="pwHint">At least 12 characters with upper-case, lower-case, a digit and a symbol.</div>
      </div>
      <div class="field">
        <label for="password2">Confirm password</label>
        <div class="input-wrap"><span class="icon" aria-hidden="true">▣</span><input id="password2" type="password" autocomplete="new-password" maxlength="128" required></div>
      </div>
      <button class="submit" type="submit" id="submitBtn">Create administrator <span aria-hidden="true">→</span></button>
      <div class="notice hidden" id="notice" role="alert"></div>
    </form>
    <div class="footer"><strong>Setup works only once</strong> &nbsp; | &nbsp; <a href="admin-login.html">HR login</a></div>
  </section>
</main>
</body>
</html>
