<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robotrac HR | HR Users</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
<script src="js/config.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/admin-common.js" defer></script>
<script src="js/admin-users.js" defer></script>
</head>
<body class="admin">
<a class="visually-hidden" href="#main">Skip to content</a>
<header class="admin-top">
  <div class="inner">
    <a class="admin-brand" href="admin-dashboard.html"><img class="brand-mark" src="assets/robotrac-mark.jpg" alt="Robotrac"><span>HR Console</span></a>
    <nav class="admin-nav" aria-label="HR navigation">
      <a href="admin-dashboard.html">Dashboard</a>
      <a href="drive-management.html">Drives</a>
      <a href="candidate-management.html">Candidates</a>
      <a href="question-bank.html">Question Bank</a>
      <a href="results-dashboard.html">Results</a>
      <a href="audit-log.html">Audit Log</a>
      <a href="admin-users.html">HR Users</a>
    </nav>
    <div class="admin-user"><span id="adminName"></span><button type="button" class="btn btn-secondary btn-sm" id="adminLogout">Log out</button></div>
  </div>
</header>
<main class="admin-main" id="main">
  <div class="page-head">
    <div><h1>HR users</h1><p>Accounts that can use this console.</p></div>
  </div>
  <div class="notice hidden" id="notice" role="alert"></div>
  <div class="two-col">
    <section class="card card-pad" aria-labelledby="uTitle">
      <h2 id="uTitle">Accounts</h2>
      <div class="table-wrap"><table class="data"><thead><tr><th scope="col">Username</th><th scope="col">Name</th><th scope="col">Created</th><th scope="col">Last login</th></tr></thead><tbody id="rows"></tbody></table></div>
    </section>
    <div class="stack">
      <section class="card card-pad" aria-labelledby="cTitle">
        <h2 id="cTitle">Create HR user</h2>
        <form id="createForm" class="form-grid" novalidate>
          <div class="form-field"><label for="c-user">Username</label><input class="input" id="c-user" maxlength="60" autocomplete="off" required></div>
          <div class="form-field"><label for="c-name">Full name</label><input class="input" id="c-name" maxlength="120" required></div>
          <div class="form-field full"><label for="c-pass">Initial password</label><input class="input" id="c-pass" type="password" maxlength="128" autocomplete="new-password" required><span class="hint">At least 12 characters with upper-case, lower-case, a digit and a symbol.</span></div>
          <div class="form-field full"><button type="submit" class="btn btn-primary" id="createBtn">Create account</button></div>
        </form>
        <div class="notice hidden" id="createNotice" role="status"></div>
      </section>
      <section class="card card-pad" aria-labelledby="pTitle">
        <h2 id="pTitle">Change my password</h2>
        <form id="pwForm" class="form-grid" novalidate>
          <div class="form-field full"><label for="p-cur">Current password</label><input class="input" id="p-cur" type="password" autocomplete="current-password" required></div>
          <div class="form-field"><label for="p-new">New password</label><input class="input" id="p-new" type="password" autocomplete="new-password" required></div>
          <div class="form-field"><label for="p-new2">Confirm new password</label><input class="input" id="p-new2" type="password" autocomplete="new-password" required></div>
          <div class="form-field full"><button type="submit" class="btn btn-primary" id="pwBtn">Change password</button></div>
        </form>
        <div class="notice hidden" id="pwNotice" role="status"></div>
      </section>
    </div>
  </div>
</main>
</body>
</html>
