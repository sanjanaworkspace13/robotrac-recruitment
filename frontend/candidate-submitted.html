<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robotrac | Submission Recorded</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/candidate.css">
<script src="js/config.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/candidate-submitted.js" defer></script>
</head>
<body class="auth-page">
<main class="shell">
  <div class="brand"><img alt="Robotrac — Electric | Robotic | Autonomous" src="assets/robotrac-logo.jpg"></div>
  <section class="card auth-card" aria-labelledby="done-title">
    <div class="done-icon" aria-hidden="true">✓</div>
    <h1 id="done-title">Thank you</h1>
    <p class="subtitle">Your examination has been submitted successfully. Your response has been recorded.</p>
    <div class="accent"></div>
    <p class="muted small">You may now close this window. The HR team will contact you about the next steps.</p>
    <button type="button" class="submit" id="logoutBtn">Log out</button>
    <div class="footer"><strong>Robotrac Recruitment Assessment</strong> &nbsp; | &nbsp; Candidate results are not displayed here</div>
  </section>
</main>
</body>
</html>
